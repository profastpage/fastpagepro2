<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO Meta Tags Optimizados -->
    <meta name="description" content="Especialistas en desarrollo de sistemas personalizados, agentes de IA, SaaS multi-tenant y plataformas escalables de alto rendimiento." />
    <meta name="keywords" content="desarrollo web, ingeniería de software, agentes de IA, SaaS multi-tenant, sistemas personalizados, plataformas escalables, automatización inteligente, agencia de desarrollo, Fast Page Pro" />
    <meta name="author" content="Fast Page Pro" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="google-site-verification" content="ZzymFjBtdjauj4C-i4OEbtRZLzDX5Z6bZWyCY8FLBvs" />

    <!-- Open Graph / Facebook (Optimizado para WhatsApp y Redes Sociales)
         IMPORTANTE: og:url DEBE coincidir con la URL canónica final (con www.)
         porque fastpagepro.com hace redirect 308 → www.fastpagepro.com y muchos
         scrapers (WhatsApp, Facebook, LinkedIn, Telegram) NO siguen el redirect
         y por eso la imagen preview dejaba de cargar. Todas las URLs absolutas
         deben usar el dominio canónico: https://www.fastpagepro.com -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fast Page Pro" />
    <meta property="og:url" content="https://www.fastpagepro.com" />
    <meta property="og:title" content="Fast Page Pro | Agencia de Desarrollo Web y Sistemas IA" />
    <meta property="og:description" content="Especialistas en desarrollo de sistemas personalizados, agentes de IA, SaaS multi-tenant y plataformas escalables de alto rendimiento." />
    <meta property="og:image" content="https://www.fastpagepro.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.fastpagepro.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fast Page Pro — Agencia de desarrollo web, sistemas IA y SaaS multi-tenant en Lima, Perú" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter (Optimizado para CTR y conversión) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.fastpagepro.com" />
    <meta name="twitter:title" content="Fast Page Pro | Agencia de Desarrollo Web y Sistemas IA" />
    <meta name="twitter:description" content="Transformamos negocios con ingeniería web avanzada y automatización inteligente." />
    <meta name="twitter:image" content="https://www.fastpagepro.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Fast Page Pro — Agencia de desarrollo web, sistemas IA y SaaS multi-tenant en Lima, Perú" />
    <meta name="twitter:image:width" content="1200" />
    <meta name="twitter:image:height" content="630" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.fastpagepro.com" />
    
    <!-- Preconnect to external domains (only the ones actually used).
         Google Fonts preconnects removed — the site uses system fonts only
         (no @import, no <link> to fonts.googleapis.com), so those handshakes
         were wasted on every visit. -->
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://api.whatsapp.com" />
    <link rel="preconnect" href="https://calendly.com" crossorigin />
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
    <link rel="dns-prefetch" href="https://calendly.com" />
    <link rel="dns-prefetch" href="https://assets.calendly.com" />
    
    <!-- Google Analytics: loaded lazily by src/components/Analytics.tsx
         only when VITE_GA_ID env var is set. Prevents wasted requests to
         googletagmanager.com when no real GA property is configured. -->

    <!-- Schema.org JSON-LD — LocalBusiness with Reviews -->

        "logo": "https://www.fastpagepro.com/favicon.svg",
        "image": "https://www.fastpagepro.com/og-image.jpg",
        "telephone": "+51933667414",
        "email": "cotizaciones@fastpagepro.com",
        "priceRange": "S/ 900 - Cotizar",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lima",
          "addressRegion": "Lima",
          "addressCountry": "PE"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -12.0464,
          "longitude": -77.0428
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "08:00",
          "closes": "22:00"
        },
        "sameAs": [],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": "5",
          "bestRating": "5",
          "worstRating": "1"
        },
        "review": [
          {
            "@type": "Review",
            "author": { "@type": "Person", "name": "Carlos Mendoza" },
            "reviewRating": { "@type": "Rating", "ratingValue": "5", "bestRating": "5" },
            "reviewBody": "Desde que implementaron el sistema de reservas por WhatsApp, nuestras reservas mensuales pasaron de 15 a 42. El mejor impacto que hemos tenido."
          },
          {
            "@type": "Review",
            "author": { "@type": "Person", "name": "Andrea Castillo" },
            "reviewRating": { "@type": "Rating", "ratingValue": "5", "bestRating": "5" },
            "reviewBody": "Necesitábamos una web que reflejara la calidad de nuestros proyectos de arquitectura costera. Nuestros clientes internacionales quedan impresionados desde el primer contacto."
          },
          {
            "@type": "Review",

        ]

    <!-- Schema.org JSON-LD — WebSite (enables Sitelinks Search Box) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Fast Page Pro",
        "alternateName": "FastPagePro",
        "url": "https://www.fastpagepro.com",
        "inLanguage": ["es", "en"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.fastpagepro.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Schema.org JSON-LD — Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        },

          "@type": "AggregateRating",

        },
        "installUrl": "https://www.fastpagepro.com",
        "screenshot": "https://www.fastpagepro.com/og-image.jpg"
      }

    <!-- Calendly Widget Assets -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />

    <title>Fast Page Pro | Agencia de Desarrollo Web y Sistemas IA</title>

</html>
